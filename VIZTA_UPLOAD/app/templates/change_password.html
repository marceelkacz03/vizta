{% extends "base.html" %}
{% block body %}
<main class="auth-shell">
    <section class="auth-card">
        <a class="back-link" href="/">VIZTA</a>
        <p class="eyebrow">Bezpieczeństwo konta</p>
        <h1>Ustaw nowe hasło</h1>
        <p class="auth-copy">
            Konto <strong>{{ user.username }}</strong> korzysta jeszcze z hasła startowego.
            Zanim wejdziesz do panelu, ustaw własne hasło.
        </p>

        {% if error %}
        <div class="form-alert">{{ error }}</div>
        {% endif %}

        <form class="auth-form" method="post" action="/panel/haslo">
            <label class="field">
                <span>Nowe hasło</span>
                <input type="password" name="new_password" autocomplete="new-password" required>
            </label>
            <label class="field">
                <span>Powtórz nowe hasło</span>
                <input type="password" name="confirm_password" autocomplete="new-password" required>
            </label>
            <button class="button button-primary button-block" type="submit">Zapisz nowe hasło</button>
        </form>
    </section>
</main>
{% endblock %}
